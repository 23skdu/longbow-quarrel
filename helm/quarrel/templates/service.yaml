apiVersion: v1
kind: Service
metadata:
  name: {{ include "quarrel.fullname" . }}
  labels:
    {{- include "quarrel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "quarrel.selectorLabels" . | nindent 4 }}
{{- if .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "quarrel.fullname" . }}
  labels:
    {{- include "quarrel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "quarrel.selectorLabels" . | nindent 6 }}
  endpoints:
    # The Prometheus endpoint is a separate listener from the API: the API
    # server serves the completions and the health probes, and the metrics
    # server serves /metrics. Scraping the API port returned nothing.
    - port: metrics
      path: {{ .Values.monitoring.metricsPath }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quarrel.fullname" . }}-pvc
  labels:
    {{- include "quarrel.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
