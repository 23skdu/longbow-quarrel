replicaCount: 1

image:
  repository: ghcr.io/23skdu/longbow-quarrel
  pullPolicy: IfNotPresent
  tag: "latest"
  cudaTag: "cuda"

model:
  name: "smollm2:135m-instruct"
  # Path to model file if not using ollama naming
  # path: "/models/model.gguf"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 2
    memory: 4Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: 1
    memory: 2Gi
    nvidia.com/gpu: "0"

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /models

probe:
  enabled: true
  livenessPath: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

monitoring:
  enabled: true
  metricsPath: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

engine:
  maxBatchSize: 16
  kvCache:
    blockSize: 16
    totalBlocks: 256

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0

podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "8080"
  # prometheus.io/path: "/metrics"

nodeSelector: {}

tolerations: []

affinity: {}
