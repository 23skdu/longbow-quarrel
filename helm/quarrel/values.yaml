replicaCount: 1

image:
  repository: ghcr.io/23skdu/longbow-quarrel
  pullPolicy: IfNotPresent
  tag: "latest"

model:
  name: "smollm2:135m-instruct"
  # Path to model file if not using ollama naming
  # path: "/models/model.gguf"

service:
  type: ClusterIP
  # The OpenAI-compatible API and the health probes.
  port: 8080
  # The Prometheus endpoint. It is a separate listener from the API: the
  # API server does not serve /metrics.
  metricsPort: 9090

resources:
  limits:
    cpu: 2
    memory: 4Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: 1
    memory: 2Gi
    nvidia.com/gpu: "0"

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /models

probe:
  enabled: true
  livenessPath: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

monitoring:
  enabled: true
  metricsPath: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

engine:
  maxBatchSize: 16
  ngl: -1
  temperature: 0.7
  topK: 40
  topP: 0.95
  minP: 0.0
  repPenalty: 1.1
  lora: ""
  kvCache:
    blockSize: 16
    totalBlocks: 256
  # Speculative decoding: a smaller model proposes the next tokens and
  # the target model verifies them. It is off unless a draft model is
  # given. The draft model runs on the CPU, so it needs no extra GPU
  # memory.
  speculative:
    draftModel: ""
    draftLength: 4
    draftPaths: 2
  # Writes a JSON activation log -- the embedding, the per-layer
  # activations and the final logits -- to this path. It is a debugging
  # aid and is off unless the path is set.
  activationLog: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "9090"
  # prometheus.io/path: "/metrics"

nodeSelector: {}

tolerations: []

affinity: {}
