openapi: 3.0.3
info:
  title: Longbow-Quarrel WebUI API
  description: |
    API for the Longbow-Quarrel LLM inference engine WebUI.
    
    ## Authentication
    
    All API endpoints require authentication via API key. The key can be provided in two ways:
    1. HTTP Header: `Authorization: ApiKey <your-api-key>`
    2. Query Parameter: `?api_key=<your-api-key>`
    
    ## Rate Limiting
    
    API keys are limited to 100 requests per minute.
    
    ## CORS
    
    CORS is configured via the `--allowed-origins` flag. By default, all origins are allowed.
    
    ## WebSocket
    
    Real-time inference streaming is available via WebSocket at `/ws`.
  version: 1.0.0
  contact:
    name: Longbow-Quarrel Team
    url: https://github.com/23skdu/longbow-quarrel
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.longbow-quarrel.example.com
    description: Production server

tags:
  - name: Models
    description: Model management endpoints
  - name: Inference
    description: Text generation endpoints
  - name: System
    description: System health and status endpoints

paths:
  /api/models:
    get:
      tags:
        - Models
      summary: List loaded models
      description: Returns a list of all currently loaded models in the engine.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/generate:
    post:
      tags:
        - Inference
      summary: Generate text
      description: |
        Generate text using the loaded model. This is a synchronous endpoint that returns the complete generated text.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            example:
              prompt: "Why is the sky blue?"
              model: "mistral:latest"
              temperature: 0.7
              max_tokens: 100
      responses:
        '200':
          description: Successful text generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/stream:
    post:
      tags:
        - Inference
      summary: Stream generated text
      description: |
        Stream generated text using Server-Sent Events (SSE).
        Each token is sent as it's generated.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            example:
              prompt: "Explain quantum computing"
              model: "mistral:latest"
              temperature: 0.7
              max_tokens: 200
      responses:
        '200':
          description: Successful streaming response
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"token": "Quantum", "token_id": 0, "complete": false, "tokens_per_sec": 45.2}
                  
                  data: {"token": " computing", "token_id": 1, "complete": false, "tokens_per_sec": 44.8}
                  
                  data: {"token": " is", "token_id": 2, "complete": false, "tokens_per_sec": 44.5}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns health status of the service.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /healthz:
    get:
      tags:
        - System
      summary: Kubernetes health check
      description: Kubernetes-compatible health check endpoint.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /readyz:
    get:
      tags:
        - System
      summary: Readiness check
      description: Returns readiness status of the service.
      responses:
        '200':
          description: Service is ready
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /version:
    get:
      tags:
        - System
      summary: Get version
      description: Returns the version of the service.
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      description: Returns Prometheus metrics for monitoring.
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /ws:
    get:
      tags:
        - Inference
      summary: WebSocket inference
      description: |
        WebSocket endpoint for real-time bidirectional inference.
        
        **Protocol:**
        
        Client sends JSON messages:
        ```json
        {
          "type": "generate",
          "prompt": "Your prompt here",
          "model": "mistral:latest",
          "temperature": 0.7,
          "max_tokens": 100
        }
        ```
        
        Server sends JSON messages:
        ```json
        {
          "type": "token",
          "token": "generated",
          "token_id": 0,
          "complete": false
        }
        ```
      responses:
        '101':
          description: Switching protocols to WebSocket

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ApiKey in format: 'ApiKey <key>'

  schemas:
    ModelInfo:
      type: object
      properties:
        name:
          type: string
          description: Model name
          example: "mistral:latest"
        path:
          type: string
          description: Model file path
          example: "/path/to/model.gguf"
        loaded:
          type: boolean
          description: Whether the model is currently loaded
          example: true
      required:
        - name
        - path
        - loaded

    GenerateRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt/text to generate from
          example: "Why is the sky blue?"
        model:
          type: string
          description: Model name to use (defaults to first loaded model)
          example: "mistral:latest"
        temperature:
          type: number
          format: float
          description: Sampling temperature (0.0-2.0)
          default: 0.7
          minimum: 0
          maximum: 2
        topk:
          type: integer
          description: Top-k sampling parameter
          default: 40
          minimum: 1
        topp:
          type: number
          format: float
          description: Top-p (nucleus) sampling parameter
          default: 0.95
          minimum: 0
          maximum: 1
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate
          default: 256
          minimum: 1
          maximum: 4096
      required:
        - prompt

    GenerateResponse:
      type: object
      properties:
        text:
          type: string
          description: The generated text
          example: "The sky appears blue due to Rayleigh scattering of sunlight."
        tokens_generated:
          type: integer
          description: Number of tokens generated
          example: 25
        tokens_per_sec:
          type: number
          format: float
          description: Generation speed in tokens per second
          example: 45.2
      required:
        - text
        - tokens_generated
        - tokens_per_sec

    VersionResponse:
      type: object
      properties:
        version:
          type: string
          description: Version string
          example: "0.1.0"
        commit:
          type: string
          description: Git commit hash
          example: "abc123def"
        build_time:
          type: string
          format: date-time
          description: Build timestamp
          example: "2024-01-15T10:30:00Z"
      required:
        - version

  responses:
    BadRequest:
      description: Bad request
      content:
        text/plain:
          schema:
            type: string
            example: "Invalid request body"

    Unauthorized:
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
            example: "API key required"

    ServiceUnavailable:
      description: Service unavailable
      content:
        text/plain:
          schema:
            type: string
            example: "Request queue full"

    InternalServerError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
            example: "Internal server error"
