name: Longbow Quarrel CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run full suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  GO_VERSION: '1.27'
  MODEL_PATH: '~/.ollama/models'
  # Pinned toolchain versions so a red build always reproduces locally.
  # golangci-lint must be v2: the repo config file is `version: "2"`.
  # goimports tracks the x/tools release series; keep it aligned with the
  # x/tools version that ships with the Go toolchain in use.
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOIMPORTS_VERSION: 'v0.50.0'
  GOSEC_VERSION: 'v2.29.0'
  GOVULNCHECK_VERSION: 'v1.8.0'

# NOTE: every action below is pinned to a major tag that runs on the Node 24
# runtime and requires a GitHub Actions runner >= 2.329.0. That applies to the
# self-hosted `[self-hosted, gpu]` runner too -- if it has not been updated
# since runner 2.327.1 the workflow will fail at the checkout step.

jobs:
  # ===== LINT AND CODE QUALITY =====
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
          go install golang.org/x/tools/cmd/goimports@"${GOIMPORTS_VERSION}"

      - name: Run golangci-lint
        # .golangci.yml sets max-issues-per-linter/max-same-issues to 0, so a
        # finding can never be hidden behind the default 50/3 report caps.
        run: golangci-lint run --timeout=10m

      - name: Check goimports
        run: |
          UNFORMATTED=$(goimports -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::goimports reported unformatted files"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Lint the workflow files with actionlint
        # .github/actionlint.yaml has existed but was never invoked, so the
        # workflows were never checked for the mistakes actionlint finds
        # (a `needs:` entry that names a job which does not exist, an
        # expression that references an undefined context, ...).
        #
        # actionlint runs shellcheck over the `run:` blocks when shellcheck
        # is installed, which it is on the GitHub runners. Without it the
        # check silently covers less, so the pinned version is installed
        # here first: the SC2086 warnings this found were masked for
        # months because the pipeline was disabled.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -config-file .github/actionlint.yaml \
            -color \
            .github/workflows/*.yml

      - name: Run go vet
        run: go vet ./...

      - name: Check for tests that cannot fail
        # Fails when a test that is not on scripts/vacuous_tests_allowlist.txt
        # has no assertion at all. The allowlist only ever shrinks.
        run: go run ./scripts/vacuous_tests

      - name: Check for duplicate package-level declarations
        # A duplicate top-level declaration only breaks the build when two
        # files that declare the same name land in the same package. With
        # build-tag-selected files that can hide in a configuration nobody
        # builds locally -- the darwin+metal combination had a duplicate
        # ErrModelSwapped, and a `!amd64` clause in internal/device/cpu.go
        # pulled that file in alongside metal.go on Apple Silicon, breaking
        # the macOS Metal build while every Linux build stayed green.
        run: ./scripts/dupcheck.sh

      - name: Type-check the Metal backend
        # The Metal backend is a `darwin && metal` build, so it is normally
        # only compiled on the macos-latest runner -- and that runner did
        # not run for months. In the meantime the backend accumulated four
        # compile errors: a missing import, an unused variable, a call with
        # the wrong arity, and a lock on a field that did not exist. All
        # four are Go *type* errors, and none of them needs the Metal
        # framework, so they can be found from a Linux runner: the check
        # strips only the `darwin` token from the build tags and builds
        # with cgo against the plain-C bridge.
        run: ./scripts/metalcheck.sh

      - name: Check the coverage table in the README
        # The table was maintained by hand and drifted: eight of its
        # nineteen rows were wrong the last time anybody checked. It is
        # generated now, and this step fails when the README does not
        # match the measurement.
        run: ./scripts/coverage_table.py --check

      - name: Check the documentation against the code
        # The Helm chart passed flags the command no longer had, the
        # Grafana dashboard queried 27 of the 133 declared metrics, and
        # the reference documentation listed flags that had changed. The
        # check fails when any of the three stops describing the code.
        run: go run ./scripts/docsync

  # ===== BUILD AND BASIC TESTS =====
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build -v ./cmd/quarrel

      - name: Install the Playwright driver
        # The browser e2e test in internal/api skips itself when the driver
        # is missing, so without this step it never runs. The community fork
        # of playwright-go can no longer download its driver (the CDN it
        # used was retired), which is why the import path is the maintained
        # upstream.
        run: |
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium

      - name: Unit tests
        env:
          GOMEMLIMIT: 1GiB
        run: go test -count=1 ./...

      - name: Race detector on concurrency-critical packages
        env:
          GOMEMLIMIT: 1GiB
        run: go test -race -timeout 600s -count=1 ./internal/engine/... ./internal/api/... ./internal/metrics/... ./internal/sampler/... ./internal/tokenizer/...

      - name: Race detector on the remaining internal packages
        # The job above only covered 5 of the 19 internal packages, so a race
        # introduced in arrow_client, device, simd, vlm, vector, gguf,
        # ollama, mathx, config, cpu, logger, models, telemetry or promtest
        # would not be caught. README and docs/features.md claim "0 data
        # races across all packages", so the whole tree is gated here.
        env:
          GOMEMLIMIT: 2GiB
        run: go test -race -timeout 900s -count=1 ./internal/arrow_client/... ./internal/device/... ./internal/simd/... ./internal/vlm/... ./internal/vector/... ./internal/gguf/... ./internal/ollama/... ./internal/mathx/... ./internal/config/... ./internal/cpu/... ./internal/logger/... ./internal/models/... ./internal/telemetry/... ./internal/promtest/...

  # ===== NESTED WEBUI MODULE =====
  # cmd/webui is its own Go module, so `go build ./...` at the repo root never
  # touches it. Without this job it has no CI coverage at all.
  webui:
    name: WebUI Module
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build, vet and test cmd/webui
        working-directory: cmd/webui
        run: |
          set -euo pipefail
          go build ./...
          go build -tags webui ./...
          go vet ./...
          go test -count=1 ./...
          # Most of cmd/webui is behind `//go:build webui`, so the package
          # list MUST be computed with the same tag: `go list ./...` without
          # it returns only cmd/webui/engine, which has no test files, and
          # the whole job silently tests nothing.
          pkgs=$(go list -tags webui ./...)
          # shellcheck disable=SC2086 # $pkgs is a list of package paths;
          # word splitting is what makes it a list.
          go vet -tags webui $pkgs
          # shellcheck disable=SC2086 # as above.
          go test -count=1 -tags webui $pkgs
  # ===== CUDA COMPILE GATE (opt-in) =====
  # The cuda build tag pulls in cgo + nvcc + cuBLAS/cuDNN, which GitHub-hosted
  # runners do not provide, so this stays opt-in: set the repository variable
  # HAS_GPU_RUNNER=true and register a runner with the `gpu` label to turn it
  # into a hard gate. scripts/run_all_tests.sh already runs the same checks
  # locally whenever nvcc and a GPU are present.
  cuda-compile:
    name: CUDA Compile Gate
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet and build with the cuda tag
        run: |
          go vet -tags cuda ./...
          go build -tags cuda ./cmd/quarrel

      - name: Test with the cuda tag
        env:
          GOMEMLIMIT: 1GiB
        run: go test -count=1 -tags cuda ./internal/engine/... ./internal/device/...

      - name: Run govulncheck on the CUDA build
        # The CUDA build pulls in the CUDA runtime bindings, which the
        # default build does not, so the vulnerability scan has to run
        # here as well. This job is the only one that has the CUDA
        # toolchain.
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" -tags=cuda ./...

  # ===== METAL BUILD (macOS only) =====
  metal-build:
    name: Metal Build
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build with Metal tags
        run: go build -v -tags "darwin,metal" ./cmd/quarrel

  # ===== METAL GPU TESTS =====
  metal-tests:
    name: Metal GPU Tests
    runs-on: macos-latest
    needs: metal-build
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-metal-tests')

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Ollama and test model
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          # Pull a small test model
          ollama pull smollm2:135m

      - name: Run Metal device tests
        env:
          GOMEMLIMIT: 2GiB
        run: go test -v -tags "darwin,metal" ./internal/device -timeout 30m

      - name: Run engine tests with Metal
        env:
          GOMEMLIMIT: 2GiB
        run: go test -v -tags "darwin,metal" ./internal/engine -timeout 30m

      - name: Run GGUF tests with Metal
        env:
          GOMEMLIMIT: 2GiB
        # ./test/integration was removed in 2ed8034; the integration-style
        # coverage now lives in internal/gguf and internal/api.
        run: go test -v -tags "darwin,metal" ./internal/gguf/... ./internal/api/... -timeout 30m

  # ===== FUZZ TESTING =====
  fuzz-tests:
    name: Fuzz Testing
    runs-on: macos-latest
    needs: metal-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        # Every entry is a fuzz target that really exists in ./internal/engine
        # under the darwin,metal tags used below, and actually fuzzes: the old
        # FuzzTokenizerV5 entry only hit a target whose body is f.Skip(...) and
        # did no work. Verified locally with -fuzz for 5s each.
        include:
          - { target: FuzzPagedKVCache_TurboQuant, duration: 30s }
          - { target: FuzzSamplerQualityControl, duration: 30s }
          - { target: FuzzKVCacheUpdate, duration: 30s }
          - { target: FuzzPagedKVCache_TurboQuant, duration: 1m }
          - { target: FuzzSamplerQualityControl, duration: 1m }
          - { target: FuzzKVCacheUpdate, duration: 1m }
          - { target: FuzzPagedKVCache_TurboQuant, duration: 5m }
          - { target: FuzzSamplerQualityControl, duration: 5m }
          - { target: FuzzKVCacheUpdate, duration: 5m }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run fuzz test
        env:
          GOMEMLIMIT: 1GiB
        # -fuzz is a regex anchored to a single target; without the anchors it
        # aborts when it matches more than one fuzz function in the package.
        run: go test -fuzz=^${{ matrix.target }}$ -fuzztime=${{ matrix.duration }} -tags "darwin,metal" ./internal/engine

      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ matrix.duration }}
          # The corpus is written next to the fuzz target, i.e.
          # internal/engine/testdata/fuzz/<Target>/. The previous path
          # (testdata/fuzz/ at the repository root) did not exist, so
          # nothing was ever uploaded.
          path: internal/engine/testdata/fuzz/
          if-no-files-found: warn

  # ===== AVX-512 COMPILE & TEST GATE =====
  # The AVX-512 kernels live behind `//go:build ... && avx512`. No build
  # target, Dockerfile or job used to pass that tag, so ~1,100 lines of
  # intrinsics were never compiled, vetted or tested -- and `make
  # simd-avx512` produced a byte-identical binary to the default build.
  #
  # The job compiles and vets the tag everywhere, and runs the simd tests
  # under it. The tests are skipped on a runner without AVX-512 (the Go
  # runtime would otherwise SIGILL), but the compile is what matters most:
  # it catches a broken intrinsic immediately.
  avx512:
    name: AVX-512 Compile & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compile and vet with the avx512 tag
        run: |
          go build -tags avx512 ./...
          go vet -tags avx512 ./...

      - name: Check the AVX-512 kernels are actually linked in
        run: |
          go build -tags avx512 -o "${RUNNER_TEMP}/quarrel-avx512" ./cmd/quarrel
          if ! go tool nm "${RUNNER_TEMP}/quarrel-avx512" | grep -q "dot_q4_k_vnni\|dot_q8_0_vnni"; then
            echo "::error::the AVX-512/VNNI kernels are not present in the -tags avx512 binary"
            exit 1
          fi
          echo "AVX-512/VNNI kernels are linked in."

      - name: Run the simd tests under the avx512 tag
        # The intrinsics raise SIGILL on a CPU without AVX-512, so the
        # tests are only meaningful on a capable runner. The compile above
        # is the gate; this is a bonus when the hardware allows it.
        if: runner.arch == 'X64'
        continue-on-error: true
        run: go test -tags avx512 -count=1 ./internal/simd/...

  # ===== ARM64 / NEON COMPILE & TEST =====
  # The NEON TurboQuant kernel did not compile: it used vandq_f32 and
  # vorrq_f32, which Apple's clang does not declare, and its absolute
  # value mask was built as an integer literal converted to a float, so
  # the bit pattern was 0x4F000000 instead of 0x7FFFFFFF. The kernel
  # therefore rounded half to even while the CPU reference and the GPU
  # round half away from zero.
  #
  # Nothing caught it because the CI has no arm64 job. This one builds
  # and tests the arm64 configuration under QEMU.
  arm64:
    name: ARM64 / NEON Compile & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up QEMU for the arm64 binaries
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Compile the arm64 build
        # The NEON kernels are C, so the build needs a cross compiler.
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${PWD}:/src" -w /src \
            -e CGO_ENABLED=1 \
            golang:1.27 \
            go build ./...

      - name: Run the SIMD tests on arm64
        # The TurboQuant parity test compares the NEON encoder with the
        # pure-Go reference, which is what catches a divergence in the
        # rounding.
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${PWD}:/src" -w /src \
            -e CGO_ENABLED=1 \
            golang:1.27 \
            go test -count=1 ./internal/simd/...

  # ===== BENCHMARK REGRESSION GATE =====
  # Runs the same benchmarks on the base commit and on this commit, back to
  # back on one runner, and fails when a benchmark gets >1.5x slower.
  bench-gate:
    name: Benchmark Regression Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve base commit
        id: base
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::No usable base commit for this event; the benchmark gate cannot run."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Comparing against ${BASE_SHA}"
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report a skipped benchmark gate
        # Previously the whole job was skipped silently when there was no
        # base commit (a first push to a branch, a force push, some
        # schedules), and the job still reported success. A gate that
        # cannot run is not a gate, so the job now says so explicitly.
        if: steps.base.outputs.run != 'true'
        run: |
          echo "::warning::The benchmark regression gate was SKIPPED because no base commit was available."
          echo "::warning::Performance regressions are NOT being detected for this event."
          echo "SKIPPED (no base commit)"

      - name: Measure base benchmarks
        if: steps.base.outputs.run == 'true'
        run: |
          git worktree add "${RUNNER_TEMP}/base" "${{ steps.base.outputs.sha }}"
          cd "${RUNNER_TEMP}/base"
          "${GITHUB_WORKSPACE}/scripts/bench_gate.sh" measure > "${RUNNER_TEMP}/base.txt"

      - name: Measure head benchmarks
        if: steps.base.outputs.run == 'true'
        run: ./scripts/bench_gate.sh measure > "${RUNNER_TEMP}/head.txt"

      - name: Compare
        if: steps.base.outputs.run == 'true'
        run: |
          echo "=== base ==="; cat "${RUNNER_TEMP}/base.txt"
          echo "=== head ==="; cat "${RUNNER_TEMP}/head.txt"
          ./scripts/bench_gate.sh compare "${RUNNER_TEMP}/base.txt" "${RUNNER_TEMP}/head.txt" 1.5

  # ===== PERFORMANCE BENCHMARKS (artifact) =====
  benchmarks:
    name: Performance Benchmarks
    runs-on: macos-latest
    needs: metal-tests
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Ollama and test model
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          # Pull a small test model
          ollama pull smollm2:135m

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -tags "darwin,metal" ./internal/device > bench_results.txt 2>&1
          cat bench_results.txt

      - name: Benchmark vs llama.cpp
        run: |
          ./scripts/benchmark_compare.sh -m ~/.ollama/models -p "The capital of France is" -n 32 > benchmark_output.txt 2>&1
          cat benchmark_output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench_results.txt
            benchmark_output.txt

  # ===== COVERAGE AND QUALITY =====
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests with coverage
        env:
          GOMEMLIMIT: 2GiB
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Process coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Verify the coverage gates
        # Both the 80% threshold and the ratchet floors are derived from the
        # coverage profile that was already produced above, so the test suite
        # is not run a second and third time, and no threshold depends on
        # parsing "go test -cover" output (which silently took only the first
        # match, and turned a failed test run into an empty string).
        run: ./scripts/coverage_gate.sh coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html

  # ===== SECURITY SCANNING =====
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pinned scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@"${GOSEC_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"

      - name: Run Gosec Security Scanner
        run: gosec -quiet ./...

      - name: Run Gosec on the AVX-512 build
        # The default build only covers the code that compiles without a build
        # tag, which is a fraction of the tree: the AVX-512, CUDA, Metal and
        # TPU backends are all excluded from it.
        run: gosec -quiet -tags=avx512 ./...

      - name: Run govulncheck
        # Replaces the archived super-linter@v4 SAST step; the rest of what it
        # linted (gofmt/goimports/vet/golangci-lint) is already enforced in the
        # lint job.
        run: govulncheck ./...

      - name: Run govulncheck on the AVX-512 build
        # The default build only covers the code that compiles without a build
        # tag, which is a fraction of the tree: the AVX-512, CUDA, Metal and
        # TPU backends are all excluded from it. The vulnerability database
        # applies to the dependencies of those builds too, and a dependency
        # that is only reachable from a tagged file is still reachable from
        # the shipped binary.
        run: govulncheck -tags=avx512 ./...

  # ===== BUILD ARTIFACTS =====
  build-artifacts:
    name: Build Artifacts
    runs-on: macos-latest
    needs: [lint, metal-build, metal-tests]
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      matrix:
        goos: [darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -v -tags "darwin,metal" -ldflags="-s -w" -o quarrel-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/quarrel

      - name: Create archive
        run: |
          tar -czf quarrel-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz quarrel-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quarrel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: quarrel-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  # ===== RELEASE CANDIDATE =====
  release-candidate:
    name: Release Candidate
    runs-on: ubuntu-latest
    needs: [coverage, benchmarks, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Generate release notes
        run: |
          # Generate changelog from commits
          echo "## Release Notes" > release_notes.md
          echo "" >> release_notes.md
          git log --oneline --since="1 week ago" >> release_notes.md

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}-rc
          name: Release Candidate ${{ github.run_number }}
          body_path: release_notes.md
          draft: true
          prerelease: true

  # ===== DOCKER BUILD MATRIX =====
  docker:
    name: Docker Build (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    needs: [lint, build]
    strategy:
      matrix:
        dockerfile: [Dockerfile.cpu, Dockerfile.nvidia, Dockerfile.webui, Dockerfile.tpu]
        include:
          - dockerfile: Dockerfile.cpu
            tag: cpu
          - dockerfile: Dockerfile.nvidia
            tag: nvidia
          - dockerfile: Dockerfile.webui
            tag: webui
          - dockerfile: Dockerfile.tpu
            tag: tpu

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build -f ${{ matrix.dockerfile }} -t longbow-quarrel:${{ matrix.tag }} .

      - name: Verify Docker image
        run: |
          docker image inspect longbow-quarrel:${{ matrix.tag }}

  # ===== DOCKER COMPOSE LINT =====
  compose-lint:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.cuda.yml config --quiet
          docker compose -f docker-compose.webui.yml config --quiet

  # ===== GHCR PUBLISH =====
  ghcr-publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, docker, compose-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:cpu-latest

      - name: Build and push NVIDIA image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.nvidia
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:cuda-latest
            ghcr.io/${{ github.repository }}:nvidia-latest

  # ===== NOTIFICATIONS =====
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, build, webui, metal-build, metal-tests, coverage, bench-gate, benchmarks, security, avx512, cuda-compile, docker, compose-lint, ghcr-publish, build-artifacts, release-candidate, fuzz-tests]
    if: always()

    steps:
      - name: Notify on success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "All CI checks passed successfully!"

      - name: Notify on failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "CI pipeline failed!"
          exit 1
