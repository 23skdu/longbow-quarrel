# DevSecOps Hardened Docker Compose for Longbow-Quarrel WebUI & Monitoring
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
      target: runtime
    container_name: longbow-quarrel-webui
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./models:/data/models:ro
      - ./cache:/data/cache:rw
    environment:
      - WEBUI_PORT=8080
      - WEBUI_METRICS_PORT=9090
      - WEBUI_HOST=0.0.0.0
      - WEBUI_DATA_DIR=/data
      - WEBUI_CACHE_DIR=/data/cache
      - WEBUI_API_KEY=${WEBUI_API_KEY:-}
      - WEBUI_ALLOWED_ORIGINS=${WEBUI_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webui-network
    profiles:
      - cuda

  webui-cpu:
    build:
      context: .
      dockerfile: Dockerfile.webui
      target: runtime-cpu
    container_name: longbow-quarrel-webui-cpu
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./models:/data/models:ro
      - ./cache:/data/cache:rw
    environment:
      - WEBUI_PORT=8080
      - WEBUI_METRICS_PORT=9090
      - WEBUI_HOST=0.0.0.0
      - WEBUI_DATA_DIR=/data
      - WEBUI_CACHE_DIR=/data/cache
      - WEBUI_API_KEY=${WEBUI_API_KEY:-}
      - WEBUI_ALLOWED_ORIGINS=${WEBUI_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 12G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webui-network
    profiles:
      - cpu

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: longbow-quarrel-prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./cmd/webui/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped
    networks:
      - webui-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.3
    container_name: longbow-quarrel-grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./cmd/webui/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped
    networks:
      - webui-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  nginx:
    image: nginx:alpine
    container_name: longbow-quarrel-nginx
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=localhost
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    networks:
      - webui-network
    depends_on:
      - webui
    profiles:
      - nginx

networks:
  webui-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
